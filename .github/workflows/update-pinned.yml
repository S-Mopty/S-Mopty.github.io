name: Update Pinned Repos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -s -H "Authorization: bearer $GH_TOKEN" \
            -X POST https://api.github.com/graphql \
            -d '{"query":"{ user(login: \"S-Mopty\") { pinnedItems(first: 6, types: REPOSITORY) { nodes { ... on Repository { name description url stargazerCount forkCount primaryLanguage { name } } } } } }"}' \
            | jq '.data.user.pinnedItems.nodes' > pinned.json

      - name: Check if pinned.json changed
        id: check
        run: |
          if git diff --quiet pinned.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pinned.json
          git commit -m "Update pinned repos"
          git push
